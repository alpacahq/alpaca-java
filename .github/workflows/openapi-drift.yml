name: OpenAPI drift

on:
  schedule:
    # Weekly Monday 09:15 UTC
    - cron: "15 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Needed so the job can create openapi-drift / openapi-adopt / breaking if missing.
  issues: write

# Serialize against the shared bot/openapi-adopt branch and PR. Overlapping
# schedule + workflow_dispatch runs would otherwise interleave force-pushes and
# PR draft/body/label updates, so an older run could clear the breaking gate.
concurrency:
  group: openapi-adopt
  cancel-in-progress: false

jobs:
  adopt-pr:
    name: Open adopt PR from upstream OAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install OpenAPI script dependencies
        run: python3 -m pip install --user -r scripts/requirements.txt

      - name: Adopt upstream OpenAPI changes
        id: adopt
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: '.'
        run: |
          set -euo pipefail
          # Always allow breaking on the bot branch; draft PR is the review gate.
          adopt_exit=0
          python3 scripts/adopt_openapi.py --yes --allow-breaking --keep-failed-adopt || adopt_exit=$?

          status_file=build/openapi-adopt-status.json
          if [[ ! -f "$status_file" ]]; then
            echo "::error::adopt exited $adopt_exit without writing $status_file"
            exit 1
          fi

          # A real breaking adopt is expected to fail the nested generateApis/test run.
          # The pins and generated sources it left behind are exactly what the draft PR
          # exists to review, so read the status file regardless of the exit code.
          outputs_file=build/adopt-outputs.env
          python3 - <<'PY' > "$outputs_file"
          import json
          from pathlib import Path
          data = json.loads(Path("build/openapi-adopt-status.json").read_text())
          print(f"breaking={'true' if data.get('breaking') else 'false'}")
          print(f"changed={'true' if data.get('changed') else 'false'}")
          PY
          if [[ "$adopt_exit" -eq 0 ]]; then
            echo "adopt_failed=false" >> "$outputs_file"
          else
            echo "adopt_failed=true" >> "$outputs_file"
          fi
          cat "$outputs_file" >> "$GITHUB_OUTPUT"

          changed="$(awk -F= '$1 == "changed" { value = $2 } END { print value }' "$outputs_file")"
          if [[ "$adopt_exit" -ne 0 && "$changed" != "true" ]]; then
            echo "::error::adopt failed (exit $adopt_exit) with no adopted changes to publish"
            exit "$adopt_exit"
          fi
          if [[ "$adopt_exit" -ne 0 ]]; then
            echo "::warning::adopt exited $adopt_exit; publishing the partial result as a draft PR"
          fi

      - name: Classify generated Java SDK compatibility
        id: sdk_compat
        if: always() && steps.adopt.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # HEAD is main as checked out above. The adopt step regenerated the working
          # tree from its candidate specs, so compare the SDK consumers compile against
          # rather than treating every upstream OpenAPI contract change as an SDK break.
          python3 scripts/sdk_api_diff.py \
            --base-ref HEAD \
            --new-root src/main/java/markets/alpaca/client/openapi \
            --report build/sdk-api-compatibility-report.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate adopted Java SDK build
        id: sdk_build
        if: always() && steps.adopt.outputs.changed == 'true'
        run: |
          set -euo pipefail
          log_file=build/openapi-sdk-build.log
          report_file=build/sdk-build-report.md

          if ./gradlew build 2>&1 | tee "$log_file"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## SDK build validation"
              echo
              echo "\`./gradlew build\` passed against the adopted specs and generated sources."
            } > "$report_file"
            exit 0
          fi

          echo "failed=true" >> "$GITHUB_OUTPUT"
          {
            echo "## SDK build validation"
            echo
            echo "> [!CAUTION]"
            echo "> \`./gradlew build\` failed against the adopted specs and generated sources."
            echo "> This PR cannot be merged until the reported SDK compilation or test failures are resolved."
            echo
            echo "### Failure excerpt"
            echo
            echo "\`\`\`text"
            # Java compiler diagnostics identify the handwritten callers or tests that
            # must be adapted to the regenerated API. Include task failures too, so a
            # non-compiler Gradle failure remains actionable from the PR description.
            grep -E '(^.*\.java:[0-9]+: error:|^> Task .* FAILED|^FAILURE:|^\* What went wrong:)' "$log_file" \
              | head -n 80 || true
            echo "\`\`\`"
            echo
            echo "See this workflow run's **Validate adopted Java SDK build** step for the complete log."
          } > "$report_file"

      - name: Open or update adopt pull request
        id: pr
        # Keep a visible draft PR for a failed adopt so the retained candidate pins and
        # generated sources are triaged instead of disappearing behind a scheduled run.
        if: always() && (steps.adopt.outputs.changed == 'true' || steps.adopt.outputs.adopt_failed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          BREAKING: ${{ steps.sdk_compat.outputs.breaking }}
          OPENAPI_BREAKING: ${{ steps.adopt.outputs.breaking }}
          ADOPT_FAILED: ${{ steps.adopt.outputs.adopt_failed }}
          SDK_BUILD_FAILED: ${{ steps.sdk_build.outputs.failed }}
          CHANGED: ${{ steps.adopt.outputs.changed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$CHANGED" == "true" ]]; then
            git checkout -B bot/openapi-adopt
            git add -A specs src/main/java/markets/alpaca/client/openapi
            if git diff --cached --quiet; then
              echo "::error::adopt reported changes but left no spec or generated changes to commit"
              exit 1
            fi
            git commit -m "chore(openapi): adopt upstream OpenAPI specs"
            git push -u origin bot/openapi-adopt --force
          elif [[ "$ADOPT_FAILED" == "true" ]]; then
            # Preserve an existing adoption branch and PR. If this is the first
            # failure, create an empty commit solely to provide a reviewable PR.
            if git fetch origin bot/openapi-adopt; then
              git checkout -B bot/openapi-adopt origin/bot/openapi-adopt
            else
              git checkout -B bot/openapi-adopt
              git commit --allow-empty -m "chore(openapi): record failed adopt"
              git push -u origin bot/openapi-adopt
            fi
            echo "::warning::adopt failed with no spec/generated diff; preserving a broken draft PR for triage"
          else
            echo "::notice::no OpenAPI changes to publish"
            exit 0
          fi

          # A failed adopt or SDK build cannot produce a mergeable PR, so it is reviewed as a draft too.
          if [[ "$BREAKING" == "true" || "$ADOPT_FAILED" == "true" || "$SDK_BUILD_FAILED" == "true" ]]; then
            draft=true
          else
            draft=false
          fi

          body_file="$(mktemp)"
          {
            if [[ "$BREAKING" == "true" ]]; then
              echo "Automated OpenAPI adopt with **breaking Java SDK compatibility changes**."
            else
              echo "Automated OpenAPI adopt with no breaking Java SDK compatibility changes."
            fi
            echo
            if [[ "$OPENAPI_BREAKING" == "true" ]]; then
              echo "The upstream OpenAPI classifier also found contract changes; it is included below as diagnostic context."
              echo
            fi
            if [[ "$ADOPT_FAILED" == "true" ]]; then
              echo "> [!WARNING]"
              echo "> The nested \`./gradlew generateApis test\` run **failed** during adopt."
              echo "> The pins and generated sources on this branch are the partial result;"
              echo "> see the failed workflow run for the build/test output."
              echo
            fi
            if [[ -f build/sdk-build-report.md ]]; then
              cat build/sdk-build-report.md
              echo
            fi
            if [[ "$draft" == "true" ]]; then
              echo "Opened as a **draft**. Review the report and generated diff carefully before marking ready to merge."
            else
              echo "Humans must review and merge."
            fi
            echo
            if [[ -f build/openapi-adopt-report.md ]]; then
              cat build/openapi-adopt-report.md
            fi
            if [[ -f build/sdk-api-compatibility-report.md ]]; then
              echo
              cat build/sdk-api-compatibility-report.md
            fi
          } > "$body_file"

          if [[ "$ADOPT_FAILED" == "true" ]]; then
            title="chore(openapi): adopt upstream OpenAPI specs (broken — needs repair)"
          elif [[ "$draft" == "true" ]]; then
            title="chore(openapi): adopt upstream OpenAPI specs (draft — needs review)"
          else
            title="chore(openapi): adopt upstream OpenAPI specs"
          fi

          number="$(gh pr list --head bot/openapi-adopt --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body-file "$body_file"
          else
            draft_flag=()
            if [[ "$draft" == "true" ]]; then
              draft_flag=(--draft)
            fi
            # Parse the created PR from gh's own output; re-listing can race with indexing.
            created_url="$(gh pr create --base main --head bot/openapi-adopt --title "$title" \
              --body-file "$body_file" "${draft_flag[@]}" | tail -n1)"
            number="${created_url##*/}"
            if [[ ! "$number" =~ ^[0-9]+$ ]]; then
              echo "::error::could not parse a PR number from: $created_url"
              exit 1
            fi
          fi

          is_draft="$(gh pr view "$number" --json isDraft --jq .isDraft)"
          if [[ "$draft" == "true" && "$is_draft" != "true" ]]; then
            gh pr ready "$number" --undo
          elif [[ "$draft" != "true" && "$is_draft" == "true" ]]; then
            gh pr ready "$number"
          fi

          # Ensure triage labels exist, then apply them strictly (missing labels must fail).
          ensure_label() {
            local name="$1" color="$2" desc="$3"
            gh label create "$name" --color "$color" --description "$desc" >/dev/null 2>&1 || true
          }
          ensure_label openapi-drift "0E8A16" "OpenAPI pin/generated drift adopt"
          ensure_label openapi-adopt "1D76DB" "Automated OpenAPI adopt PR"
          ensure_label breaking "D93F0B" "Generated Java SDK compatibility changes detected"
          ensure_label sdk-build-failure "B60205" "Adopted SDK does not compile or pass tests"
          ensure_label openapi-adopt-failed "B60205" "OpenAPI adoption failed compatibility checks"

          gh pr edit "$number" --add-label openapi-drift --add-label openapi-adopt
          if [[ "$ADOPT_FAILED" == "true" ]]; then
            gh pr edit "$number" --add-label openapi-adopt-failed
          else
            gh pr edit "$number" --remove-label openapi-adopt-failed || true
          fi
          if [[ "$BREAKING" == "true" ]]; then
            gh pr edit "$number" --add-label breaking
          else
            # remove-label fails when the label was never present; that is fine.
            gh pr edit "$number" --remove-label breaking || true
          fi
          if [[ "$SDK_BUILD_FAILED" == "true" ]]; then
            gh pr edit "$number" --add-label sdk-build-failure
          else
            gh pr edit "$number" --remove-label sdk-build-failure || true
          fi

      - name: Fail the run when adopt did not complete cleanly
        if: always() && steps.adopt.outputs.changed == 'true' && (steps.adopt.outputs.adopt_failed == 'true' || steps.sdk_build.outputs.failed == 'true')
        run: |
          echo "::error::adopt or SDK build failed; the branch holds the result for review"
          exit 1
