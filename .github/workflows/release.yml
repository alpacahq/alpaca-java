name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      recover_existing_release:
        description: Recovery only after confirming Central accepted an ambiguous NMCP publication
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# GitHub keeps at most one running and one pending run per concurrency group;
# a newer dispatch can replace an older pending run. Do not queue releases.
concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  central_publish:
    name: Validate, build, and publish to Central (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The maven-central environment must independently restrict deployments to
    # main. That policy is the protection against modified workflows on branches.
    environment: maven-central
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}

    # Recovery warning: if NMCP times out after Central accepts this immutable
    # GAV, verify Central and dispatch a new run with recover_existing_release.
    # Rerunning later failed jobs does not repeat a successful publication job.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_tag="$RELEASE_TAG_INPUT"
          if ! release_version="$(
            python3 scripts/release_tools.py parse-tag "$release_tag"
          )"; then
            echo "::error::Release tag must exactly match vMAJOR.MINOR.PATCH (for example, v1.2.3)"
            exit 1
          fi

          git_auth_header="$(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n'
          )"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $git_auth_header" \
            fetch --force --tags origin \
            refs/heads/main:refs/remotes/origin/main
          unset git_auth_header

          tag_ref="refs/tags/$release_tag"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "::error::Tag '$release_tag' does not exist"
            exit 1
          fi
          if ! tag_commit="$(git rev-parse --verify "${tag_ref}^{commit}")"; then
            echo "::error::Tag '$release_tag' does not resolve to a commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::Tagged commit $tag_commit is not reachable from origin/main"
            exit 1
          fi

          {
            echo "tag=$release_tag"
            echo "version=$release_version"
            echo "commit=$tag_commit"
          } >> "$GITHUB_OUTPUT"

          git checkout --detach "$tag_ref"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "::error::Detached checkout does not match the verified tagged commit"
            exit 1
          fi

      - name: Require curated CHANGELOG notes
        id: changelog-gate
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          curated_notes="$RUNNER_TEMP/curated-release-notes.md"
          if ! python3 scripts/release_tools.py extract-changelog \
            --changelog CHANGELOG.md \
            --version "$RELEASE_VERSION" \
            --allow-unreleased \
            --output "$curated_notes" \
            --github-output "$GITHUB_OUTPUT"; then
            echo "::error::CHANGELOG.md on the tagged commit must contain a non-empty ## [$RELEASE_VERSION] section, or a non-empty ## [Unreleased] fallback when no ## [$RELEASE_VERSION] heading exists"
            exit 1
          fi
          source="$(
            awk -F= '$1 == "source" { value = $2 } END { print value }' "$GITHUB_OUTPUT"
          )"
          if [[ "$source" == "unreleased" ]]; then
            echo "::notice::Curated release notes will use ## [Unreleased]; the post-release bump PR should promote it to ## [$RELEASE_VERSION] on main"
          fi

      - name: Test tagged release tooling
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Check exact Maven Central publication
        id: central-check
        shell: bash
        env:
          RECOVERY_MODE: ${{ inputs.recover_existing_release }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          pom_file="$RUNNER_TEMP/alpaca-java-$RELEASE_VERSION.pom"
          pom_url="https://repo.maven.apache.org/maven2/markets/alpaca/alpaca-java/$RELEASE_VERSION/alpaca-java-$RELEASE_VERSION.pom"

          if ! http_status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-redirs 3 \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 1048576 \
              --proto '=https' \
              --proto-redir '=https' \
              --output "$pom_file" \
              --write-out '%{http_code}' \
              "$pom_url"
          )"; then
            echo "::error::Unable to query Maven Central for the exact release POM; no publication or recovery action was attempted"
            exit 1
          fi

          if [[ "$RECOVERY_MODE" == "true" ]]; then
            if [[ "$http_status" == "404" ]]; then
              echo "::error::Recovery requires the exact POM to be publicly available on Maven Central. It may still be propagating; wait, verify Central, and dispatch recovery again later."
              exit 1
            fi
            if [[ "$http_status" != "200" ]]; then
              echo "::error::Recovery POM lookup returned HTTP $http_status; refusing to skip publication"
              exit 1
            fi

            if ! python3 scripts/release_tools.py validate-pom \
              --pom "$pom_file" \
              --group markets.alpaca \
              --artifact alpaca-java \
              --version "$RELEASE_VERSION"; then
              echo "::error::The public recovery POM failed exact coordinate validation"
              exit 1
            fi

            echo "publish_required=false" >> "$GITHUB_OUTPUT"
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Maven Central recovery verified
          Confirmed the public POM for \`markets.alpaca:alpaca-java:$RELEASE_VERSION\`
          and matched its XML coordinates. Build, signing, and upload were skipped; downstream
          GitHub Release creation and the main version bump may proceed.
          EOF
            exit 0
          fi

          if [[ "$http_status" == "200" ]]; then
            echo "::error::The immutable release markets.alpaca:alpaca-java:$RELEASE_VERSION already exists on Maven Central. Confirm it, then dispatch this workflow with recover_existing_release enabled."
            exit 1
          fi
          if [[ "$http_status" != "404" ]]; then
            echo "::error::Maven Central preflight returned HTTP $http_status; refusing to attempt publication"
            exit 1
          fi

          echo "publish_required=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.central-check.outputs.publish_required == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.central-check.outputs.publish_required == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare release OpenAPI specs
        if: steps.central-check.outputs.publish_required == 'true'
        id: specs
        shell: bash
        run: |
          set -euo pipefail
          # Releases publish the committed pins under specs/ (not a live OAS fetch).
          spec_dir="$RUNNER_TEMP/alpaca-release-specs"
          if ! python3 scripts/release_tools.py prepare-frozen-specs \
            --source-root specs \
            --output-dir "$spec_dir"; then
            echo "::error::Unable to prepare immutable OpenAPI release inputs from committed specs/"
            exit 1
          fi
          echo "directory=$spec_dir" >> "$GITHUB_OUTPUT"

      - name: Upload verified release inputs
        if: steps.central-check.outputs.publish_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs-${{ steps.release.outputs.version }}
          path: ${{ steps.specs.outputs.directory }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Build tagged release from prepared specs
        if: steps.central-check.outputs.publish_required == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SPEC_DIR: ${{ steps.specs.outputs.directory }}
        run: |
          set -euo pipefail
          ./gradlew build \
            -Pversion="$RELEASE_VERSION" \
            -Palpaca.preprocessedSpecInputs=true \
            "-PbrokerSpec=$SPEC_DIR/broker/openapi.yaml" \
            "-PdataSpec=$SPEC_DIR/data/openapi.yaml" \
            "-PtradingSpec=$SPEC_DIR/trading/openapi.yaml"

      - name: Record Central recovery guidance
        if: steps.central-check.outputs.publish_required == 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Maven Central recovery
          The release resolves and preprocesses each OpenAPI spec once, then uses those exact
          local copies for both build and publication.
          If NMCP times out after Central may have accepted the GAV, verify the deployment
          in Central Portal. Once its POM is public, dispatch a new run with
          \`recover_existing_release\` enabled instead of retrying publication. Use “rerun
          failed jobs” when only the GitHub Release or main-version bump job failed.
          EOF

      - name: Publish immutable release to Maven Central
        if: steps.central-check.outputs.publish_required == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SPEC_DIR: ${{ steps.specs.outputs.directory }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew publishAggregationToCentralPortal \
            -Pversion="$RELEASE_VERSION" \
            -Palpaca.preprocessedSpecInputs=true \
            "-PbrokerSpec=$SPEC_DIR/broker/openapi.yaml" \
            "-PdataSpec=$SPEC_DIR/data/openapi.yaml" \
            "-PtradingSpec=$SPEC_DIR/trading/openapi.yaml"

  github_release:
    name: Create GitHub Release
    needs: central_publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.central_publish.outputs.tag }}

      - name: Revalidate checked-out tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.central_publish.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.central_publish.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          git_auth_header="$(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n'
          )"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $git_auth_header" \
            fetch --force --tags origin
          unset git_auth_header
          if ! actual_commit="$(git rev-parse --verify "${tag_ref}^{commit}")"; then
            echo "::error::Verified release tag '$RELEASE_TAG' is no longer available"
            exit 1
          fi
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' no longer resolves to the validated commit"
            exit 1
          fi
          git checkout --detach "$tag_ref"

      - name: Create GitHub Release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.central_publish.outputs.tag }}
          RELEASE_VERSION: ${{ needs.central_publish.outputs.version }}
        run: |
          set -euo pipefail

          releases_file="$(mktemp)"
          trap 'rm -f "$releases_file"' EXIT
          if ! gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft] | @tsv" \
            > "$releases_file"; then
            echo "::error::GitHub Release lookup failed; refusing to create or publish"
            exit 1
          fi

          mapfile -t matching_releases < "$releases_file"
          if (( ${#matching_releases[@]} > 1 )); then
            echo "::error::Multiple GitHub Releases use tag '$RELEASE_TAG'; refusing to choose one"
            exit 1
          fi
          if (( ${#matching_releases[@]} == 1 )); then
            IFS=$'\t' read -r release_id is_draft <<< "${matching_releases[0]}"
            if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
              echo "::error::GitHub Release lookup returned an invalid release ID"
              exit 1
            fi
            if [[ "$is_draft" == "true" ]]; then
              gh api \
                --method PATCH \
                "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -F draft=false \
                > /dev/null
              echo "::notice::Published existing draft GitHub Release '$RELEASE_TAG' unchanged"
            elif [[ "$is_draft" == "false" ]]; then
              echo "::notice::GitHub Release '$RELEASE_TAG' already exists; leaving it unchanged"
            else
              echo "::error::GitHub Release lookup returned an invalid draft state"
              exit 1
            fi
            exit 0
          fi

          curated_notes="$RUNNER_TEMP/curated-release-notes.md"
          generated_notes_file="$RUNNER_TEMP/generated-release-notes.md"
          release_notes="$RUNNER_TEMP/github-release-notes.md"
          if ! python3 scripts/release_tools.py extract-changelog \
            --changelog CHANGELOG.md \
            --version "$RELEASE_VERSION" \
            --allow-unreleased \
            --output "$curated_notes"; then
            echo "::error::Unable to extract curated CHANGELOG notes for GitHub Release"
            exit 1
          fi

          if ! gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            --jq .body > "$generated_notes_file"; then
            echo "::error::GitHub generate-notes failed; refusing to create a release without a compare link"
            exit 1
          fi

          if ! python3 scripts/release_tools.py compose-github-release-notes \
            --curated "$curated_notes" \
            --generated "$generated_notes_file" \
            --output "$release_notes"; then
            echo "::error::Unable to compose GitHub Release notes"
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$release_notes"

  bump_main:
    name: Open next patch development pull request
    needs:
      - central_publish
      - github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main
          git checkout --detach refs/remotes/origin/main

      - name: Prepare next development version and CHANGELOG
        id: next-version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.central_publish.outputs.tag }}
          RELEASE_VERSION: ${{ needs.central_publish.outputs.version }}
        run: |
          set -euo pipefail
          if ! python3 scripts/release_tools.py update-version \
            --properties gradle.properties \
            --release-version "$RELEASE_VERSION" \
            --github-output "$GITHUB_OUTPUT"; then
            echo "::error::Unable to calculate or safely apply the next development version"
            exit 1
          fi

          version_status="$(
            awk -F= '$1 == "status" { value = $2 } END { print value }' "$GITHUB_OUTPUT"
          )"
          case "$version_status" in
            equal)
              echo "::notice::Main already has the next development version"
              ;;
            ahead)
              echo "::error::Main is ahead of the expected next development version; refusing to continue without an explicit recovery plan"
              exit 1
              ;;
            behind)
              ;;
            *)
              echo "::error::Version comparison did not produce a recognized status"
              exit 1
              ;;
          esac

          # Promote only the notes that were published for this tag; main may have
          # moved on since the release commit.
          tagged_changelog="$RUNNER_TEMP/tagged-CHANGELOG.md"
          published_notes="$RUNNER_TEMP/published-release-notes.md"
          git fetch --force --tags origin
          if ! git show "refs/tags/$RELEASE_TAG:CHANGELOG.md" > "$tagged_changelog"; then
            echo "::error::Unable to read CHANGELOG.md from tag $RELEASE_TAG"
            exit 1
          fi
          if ! python3 scripts/release_tools.py extract-changelog \
            --changelog "$tagged_changelog" \
            --version "$RELEASE_VERSION" \
            --allow-unreleased \
            --output "$published_notes"; then
            echo "::error::Unable to re-read the curated notes published for $RELEASE_VERSION"
            exit 1
          fi

          release_date="$(date -u +%F)"
          if ! python3 scripts/release_tools.py promote-changelog \
            --changelog CHANGELOG.md \
            --version "$RELEASE_VERSION" \
            --date "$release_date" \
            --expected-body "$published_notes" \
            --github-output "$GITHUB_OUTPUT"; then
            echo "::error::Unable to promote CHANGELOG.md for $RELEASE_VERSION on main"
            exit 1
          fi

          changelog_changed="$(
            awk -F= '$1 == "changed" { value = $2 } END { print value }' "$GITHUB_OUTPUT"
          )"
          changelog_status="$(
            awk -F= '$1 == "changelog_status" { value = $2 } END { print value }' "$GITHUB_OUTPUT"
          )"
          if [[ "$changelog_status" == "diverged" ]]; then
            echo "::warning::CHANGELOG.md on main already has a [$RELEASE_VERSION] section whose content differs from the notes published for $RELEASE_TAG; reconcile them manually"
          fi
          mapfile -t changed_files < <(git diff --name-only)
          properties_changed=false
          changelog_file_changed=false
          for path in "${changed_files[@]+"${changed_files[@]}"}"; do
            case "$path" in
              gradle.properties) properties_changed=true ;;
              CHANGELOG.md) changelog_file_changed=true ;;
              *)
                echo "::error::Unexpected changed file during release bump: $path"
                exit 1
                ;;
            esac
          done

          if [[ "$changelog_changed" == "true" && "$changelog_file_changed" != "true" ]]; then
            echo "::error::promote-changelog reported a change but CHANGELOG.md is unmodified"
            exit 1
          fi
          if [[ "$changelog_changed" != "true" && "$changelog_file_changed" == "true" ]]; then
            echo "::error::CHANGELOG.md changed unexpectedly"
            exit 1
          fi
          if [[ "$version_status" == "behind" && "$properties_changed" != "true" ]]; then
            echo "::error::Version bump status is behind but gradle.properties is unmodified"
            exit 1
          fi
          if [[ "$version_status" == "equal" && "$properties_changed" == "true" ]]; then
            echo "::error::Version status is equal but gradle.properties changed"
            exit 1
          fi

          if [[ "$properties_changed" == "true" || "$changelog_file_changed" == "true" ]]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
            echo "changelog_changed=$changelog_file_changed" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            echo "changelog_changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Main already has the next development version and CHANGELOG.md; no bump PR is needed"
          fi

      - name: Create next development version pull request
        if: steps.next-version.outputs.should_push == 'true'
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.version }}
          RELEASE_VERSION: ${{ needs.central_publish.outputs.version }}
          CHANGELOG_CHANGED: ${{ steps.next-version.outputs.changelog_changed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch="release/start-$NEXT_VERSION"

          paths=()
          if git diff --name-only | grep -qx 'gradle.properties'; then
            paths+=(gradle.properties)
          fi
          if git diff --name-only | grep -qx 'CHANGELOG.md'; then
            paths+=(CHANGELOG.md)
          fi
          if (( ${#paths[@]} == 0 )); then
            echo "::error::Bump PR was requested but no allowed files changed"
            exit 1
          fi

          existing_pr="$(
            gh pr list \
              --base main \
              --head "$branch" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"
          if [[ -n "$existing_pr" ]]; then
            # An open PR from an earlier run may predate a required change
            # (for example a CHANGELOG promotion); never silently skip it.
            if ! git fetch --force origin \
              "refs/heads/$branch:refs/remotes/origin/$branch"; then
              echo "::error::Unable to inspect existing pull request branch '$branch'"
              exit 1
            fi
            for path in "${paths[@]}"; do
              existing_file="$RUNNER_TEMP/existing-${path//\//_}"
              if ! git show "refs/remotes/origin/$branch:$path" > "$existing_file"; then
                echo "::error::Existing pull request $existing_pr does not contain $path; update it manually"
                exit 1
              fi
              if ! cmp -s "$existing_file" "$path"; then
                echo "::error::Existing pull request $existing_pr does not match the required $path content; update it manually"
                exit 1
              fi
            done
            echo "::notice::Version-bump pull request already covers these changes: $existing_pr"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "${paths[@]}"

          mapfile -t staged_files < <(git diff --cached --name-only)
          for staged in "${staged_files[@]}"; do
            case "$staged" in
              gradle.properties|CHANGELOG.md) ;;
              *)
                echo "::error::Refusing to commit disallowed file: $staged"
                exit 1
                ;;
            esac
          done

          if [[ "$CHANGELOG_CHANGED" == "true" ]]; then
            commit_message="chore: start $NEXT_VERSION development"
            pr_title="chore: start $NEXT_VERSION development"
            pr_body="Automated post-release updates: next snapshot in \`gradle.properties\` and CHANGELOG promotion of \`$RELEASE_VERSION\`."
            if ! printf '%s\n' "${staged_files[@]}" | grep -qx 'gradle.properties'; then
              commit_message="chore: promote CHANGELOG for $RELEASE_VERSION"
              pr_title="chore: promote CHANGELOG for $RELEASE_VERSION"
              pr_body="Automated post-release CHANGELOG promotion for \`$RELEASE_VERSION\` (version property already current)."
            fi
          else
            commit_message="chore: start $NEXT_VERSION development"
            pr_title="chore: start $NEXT_VERSION development"
            pr_body="Automated post-release version bump. This PR changes only \`gradle.properties\`."
          fi

          git commit -m "$commit_message"
          git push origin "HEAD:refs/heads/$branch"

          pr_url="$(
            gh pr create \
              --base main \
              --head "$branch" \
              --title "$pr_title" \
              --body "$pr_body"
          )"
          echo "::notice::Opened version-bump pull request: $pr_url"
