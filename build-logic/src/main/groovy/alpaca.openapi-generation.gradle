tasks.register('downloadUpstreamOpenApi') {
    group = 'openapi tools'
    description = 'Downloads live Broker/Data/Trading OAS into build/upstream/'
    outputs.files(upstreamBrokerJson, upstreamDataJson, upstreamTradingJson)
    outputs.upToDateWhen { false }

    doLast {
        def downloads = [
            [upstreamUrlDefaults.broker, upstreamBrokerJson.get().asFile],
            [upstreamUrlDefaults.data, upstreamDataJson.get().asFile],
            [upstreamUrlDefaults.trading, upstreamTradingJson.get().asFile],
        ]
        downloads.each { entry ->
            def url = entry[0] as String
            println "Fetching ${url}"
            OpenApiSpecSupport.downloadSpec(url, entry[1] as File)
        }
    }
}

