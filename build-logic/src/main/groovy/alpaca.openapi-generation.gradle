def runAdoptProcess = { org.gradle.process.ExecOperations execOps, List<String> command,
    boolean ignoreExitValue = false ->
    execOps.exec {
        workingDir rootProject.projectDir
        commandLine command
        it.ignoreExitValue = ignoreExitValue
    }
}

// The shell entrypoint owns the .venv-openapi bootstrap for both Gradle and standalone use.
def runAdoptPython = { org.gradle.process.ExecOperations execOps, List<String> scriptArgs ->
    runAdoptProcess(
        execOps,
        [new File(rootProject.projectDir, 'scripts/run_adopt_openapi.sh').absolutePath]
            + scriptArgs)
}

def upstreamPreprocessTasks = [
    'downloadUpstreamOpenApi',
    'preprocessUpstreamBrokerSpec',
    'preprocessUpstreamDataSpec',
    'preprocessUpstreamTradingSpec',
]

// Diff/apply against build/specs-adopt only — never rewires pin-based preprocess*.
// Project.exec was removed in Gradle 9; use injected ExecOperations instead.
tasks.register('adoptOpenApiDryRun') {
    group = 'openapi tools'
    description = 'Fetch upstream OAS, preprocess, and print a semantic adopt report (no pin writes)'
    dependsOn upstreamPreprocessTasks
    outputs.upToDateWhen { false }
    def execOps = objects.newInstance(markets.alpaca.gradle.InjectedExecOps).execOps
    doLast {
        runAdoptPython(execOps, ['--dry-run', '--skip-fetch', '--skip-preprocess'])
    }
}

tasks.register('adoptOpenApiApplyPins') {
    group = 'openapi tools'
    description = 'Write additive upstream pins into specs/ (no generate); fails on breaking drift'
    dependsOn upstreamPreprocessTasks
    outputs.upToDateWhen { false }
    def execOps = objects.newInstance(markets.alpaca.gradle.InjectedExecOps).execOps
    doLast {
        runAdoptPython(execOps, ['--yes', '--skip-fetch', '--skip-preprocess', '--skip-generate'])
    }
}

tasks.register('adoptOpenApiApplyPinsBreaking') {
    group = 'openapi tools'
    description = 'Write upstream pins into specs/ including breaking changes (no generate)'
    dependsOn upstreamPreprocessTasks
    outputs.upToDateWhen { false }
    def execOps = objects.newInstance(markets.alpaca.gradle.InjectedExecOps).execOps
    doLast {
        runAdoptPython(
            execOps,
            ['--yes', '--allow-breaking', '--skip-fetch', '--skip-preprocess', '--skip-generate'])
    }
}

// Nested generate+test so pin writes are re-snapshotted. In-process generateApis as a
// sibling of adoptOpenApiApplyPins* keeps a stale specs/ fingerprint from before the
// pin write (mustRunAfter on the umbrella task does not order preprocess*Spec).
tasks.register('adoptOpenApiRegenerate') {
    group = 'openapi tools'
    description = 'Nested generateApis + test after adopt pin writes (fresh specs/ snapshot)'
    outputs.upToDateWhen { false }
    def execOps = objects.newInstance(markets.alpaca.gradle.InjectedExecOps).execOps
    def pinBackupSpecs = ['broker', 'data', 'trading'].collect { api ->
        layout.buildDirectory.file("specs-pin-backup/${api}/openapi.yaml")
    }
    def specSourceProperties = ['brokerSpec', 'dataSpec', 'tradingSpec']
    def restoredPinProperties = ['broker', 'data', 'trading'].collect { api ->
        "-P${api}Spec=${rootProject.file("specs/${api}/openapi.yaml").absolutePath}"
    }
    def gradleWrapper = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        ? 'gradlew.bat'
        : './gradlew'
    doLast {
        // Drop spec-source overrides and force pin paths so nested generateApis
        // reads the pins just written to specs/, not whatever redirected the parent.
        def forwardedProperties = gradle.startParameter.projectProperties
            .findAll { key, value -> !(key in specSourceProperties) }
            .collect { key, value -> "-P${key}=${value}" }
        def result = runAdoptProcess(
            execOps,
            [gradleWrapper, 'generateApis', 'test'] + forwardedProperties + restoredPinProperties,
            true)
        if (result.exitValue == 0) {
            return
        }
        // A surviving backup means generation never completed, so specs/ is ahead of the
        // generated sources; undo the pin write. Otherwise both already advanced together.
        if (pinBackupSpecs.every { it.get().asFile.isFile() }) {
            runAdoptPython(execOps, ['--restore-pins'])
            // Generation syncs each API as it finishes, so a failed run can still have
            // rewritten some packages; rebuild them all from the restored pins. Spec-source
            // overrides are dropped: recovery must read specs/, not whatever redirected
            // (and possibly broke) the run being undone.
            def recoveryProperties = gradle.startParameter.projectProperties
                .findAll { key, value -> !(key in specSourceProperties) }
                .collect { key, value -> "-P${key}=${value}" }
            def resync = runAdoptProcess(
                execOps,
                [gradleWrapper, 'generateApis'] + recoveryProperties + restoredPinProperties,
                true)
            throw new GradleException(resync.exitValue == 0
                ? 'generateApis failed after the adopt pin update; pinned specs and generated ' +
                    'sources were restored.'
                : 'generateApis failed after the adopt pin update. Pinned specs were restored ' +
                    'but regenerating from them failed too; inspect specs/ and ' +
                    'src/main/java/markets/alpaca/client/openapi/ with git status.')
        }
        throw new GradleException(
            'The nested generateApis/test build failed with no pending pin update to undo ' +
            '(for example failing tests after a successful generate), so specs/ was left ' +
            'as-is. Review the output above and revert specs/ plus ' +
            'src/main/java/markets/alpaca/client/openapi/ with git to abandon the adopt.')
    }
}

tasks.register('adoptOpenApi') {
    group = 'openapi tools'
    description = 'Adopt additive upstream OAS changes into specs/ and regenerate clients'
    dependsOn 'adoptOpenApiApplyPins', 'adoptOpenApiRegenerate'
}

tasks.register('adoptOpenApiBreaking') {
    group = 'openapi tools'
    description = 'Adopt upstream OAS including breaking changes into specs/ and regenerate clients'
    dependsOn 'adoptOpenApiApplyPinsBreaking', 'adoptOpenApiRegenerate'
}

tasks.named('adoptOpenApiRegenerate').configure {
    mustRunAfter 'adoptOpenApiApplyPins', 'adoptOpenApiApplyPinsBreaking'
}

pluginManager.withPlugin('java') {
    tasks.named('test').configure {
        mustRunAfter 'generateApis'
    }

    tasks.matching {
        it.name in ['compileJava', 'sourcesJar', 'javadocJar', 'javadoc']
    }.configureEach {
        dependsOn 'generateApis'
    }

    tasks.matching { it.name == 'check' }.configureEach {
        dependsOn 'checkGenerated'
    }
}
