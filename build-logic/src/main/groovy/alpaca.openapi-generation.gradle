tasks.register('checkGenerated') {
    group = 'verification'
    description = 'Regenerates from pinned specs and fails if specs/ or generated OpenAPI sources drift'
    dependsOn 'generateApis'
    doLast {
        def proc = new ProcessBuilder(
            'git', 'status', '--porcelain', '--',
            'specs', 'src/main/java/markets/alpaca/client/openapi')
            .directory(rootProject.projectDir)
            .redirectErrorStream(true)
            .start()
        def out = new String(proc.inputStream.readAllBytes()).trim()
        def exit = proc.waitFor()
        if (exit != 0) {
            throw new GradleException("git status failed while checking generated outputs:\n${out}")
        }
        if (out) {
            throw new GradleException(
                "Generated OpenAPI outputs are out of date:\n${out}\n" +
                    'Run ./gradlew generateApis and commit specs/ + ' +
                    'src/main/java/markets/alpaca/client/openapi/.')
        }
    }
}

def printSpecVersionsEnabled = !providers
    .gradleProperty('alpaca.skipSpecVersions')
    .map { it.toBoolean() }
    .getOrElse(false)

if (printSpecVersionsEnabled) {
    tasks.named('generateApis').configure {
        dependsOn 'printSpecVersions'
    }
    ['generateBrokerApi', 'generateDataApi', 'generateTradingApi'].each { taskName ->
        tasks.named(taskName).configure {
            dependsOn 'printSpecVersions'
        }
    }
}

tasks.register('printSpecVersions') {
    group = 'openapi tools'
    description = 'Prints the version and source of each OAS spec'

    def specEntries = [
        [api: 'broker', source: brokerSpecSource],
        [api: 'data', source: dataSpecSource],
        [api: 'trading', source: tradingSpecSource],
    ]

    if (specEntries.any { OpenApiSpecSupport.isUrl(it.source as String) }) {
        outputs.upToDateWhen { false }
    }
    def localSpecFiles = specEntries
        .findAll { !OpenApiSpecSupport.isUrl(it.source as String) }
        .collect { file(it.source) }
    if (localSpecFiles) {
        inputs.files(localSpecFiles)
    }

    def stampFile = layout.buildDirectory.file('specs/.print-versions-stamp')
    outputs.file(stampFile)

    doLast {
        println ''
        println 'OAS specs:'
        specEntries.each { entry ->
            def source = entry.source as String
            def spec = OpenApiSpecSupport.loadSpec(source)
            def version = spec?.info?.version ?: 'unknown'
            if (OpenApiSpecSupport.isUrl(source)) {
                printf(
                    '  %-10s  v%-12s  source: %s%n',
                    entry.api,
                    version,
                    source)
            } else {
                def specFile = file(source)
                def modified = Instant.ofEpochMilli(specFile.lastModified())
                    .atZone(ZoneId.systemDefault())
                    .format(DateTimeFormatter.ofPattern('yyyy-MM-dd HH:mm'))
                printf(
                    '  %-10s  v%-12s  source: %s  (last modified: %s)%n',
                    entry.api,
                    version,
                    specFile.absolutePath,
                    modified)
            }
        }
        println ''
        stampFile.get().asFile.text = Instant.now().toString()
    }
}

def upstreamBrokerJson = layout.buildDirectory.file('upstream/broker.json')
def upstreamDataJson = layout.buildDirectory.file('upstream/data.json')
def upstreamTradingJson = layout.buildDirectory.file('upstream/trading.json')
def adoptBrokerSpec = layout.buildDirectory.file('specs-adopt/broker/openapi.yaml')
def adoptDataSpec = layout.buildDirectory.file('specs-adopt/data/openapi.yaml')
def adoptTradingSpec = layout.buildDirectory.file('specs-adopt/trading/openapi.yaml')

tasks.register('downloadUpstreamOpenApi') {
    group = 'openapi tools'
    description = 'Downloads live Broker/Data/Trading OAS into build/upstream/'
    outputs.files(upstreamBrokerJson, upstreamDataJson, upstreamTradingJson)
    outputs.upToDateWhen { false }

    doLast {
        def downloads = [
            [upstreamUrlDefaults.broker, upstreamBrokerJson.get().asFile],
            [upstreamUrlDefaults.data, upstreamDataJson.get().asFile],
            [upstreamUrlDefaults.trading, upstreamTradingJson.get().asFile],
        ]
        downloads.each { entry ->
            def url = entry[0] as String
            def destination = entry[1] as File
            destination.parentFile.mkdirs()
            println "Fetching ${url}"
            def connection = URI.create(url).toURL().openConnection()
            connection.setRequestProperty('User-Agent', 'alpaca-java-openapi-adopt/1.0')
            connection.setRequestProperty('Accept', 'application/json, application/yaml, text/yaml, */*')
            connection.setConnectTimeout(60_000)
            connection.setReadTimeout(60_000)
            def status = connection.responseCode
            if (status < 200 || status >= 300) {
                throw new GradleException(
                    "Failed to download OpenAPI spec from ${url} (HTTP ${status})")
            }
            destination.withOutputStream { output ->
                connection.inputStream.withStream { input ->
                    output << input
                }
            }
        }
    }
}

// Isolated from pin-based preprocess*: safe to combine with ./gradlew build in one invocation.
tasks.register('preprocessUpstreamBrokerSpec') {
