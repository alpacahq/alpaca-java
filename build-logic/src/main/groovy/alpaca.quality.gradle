import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.jar.JarFile

plugins {
    id 'checkstyle'
    id 'com.github.spotbugs'
    id 'com.diffplug.spotless'
}

def apiBaselineVersion = providers.gradleProperty('apiBaselineVersion').orElse('0.1.4')
// Reviewed generated-surface breaks adopted on main before this compatibility gate existed.
// Keep these member-specific: broad class/package exclusions would hide future regressions.
def reviewedApiCompatibilityExclusions = [
    'markets.alpaca.client.openapi.broker.api.EventsApi#suscribeToAccountStatusSSE' +
        '(java.time.LocalDate,java.time.LocalDate,java.lang.Integer,java.lang.Integer,' +
        'java.lang.String,java.lang.String,java.lang.String)',
    'markets.alpaca.client.openapi.broker.api.EventsApi#suscribeToAccountStatusSSEAsync' +
        '(java.time.LocalDate,java.time.LocalDate,java.lang.Integer,java.lang.Integer,' +
        'java.lang.String,java.lang.String,java.lang.String,' +
        'markets.alpaca.client.openapi.broker.http.ApiCallback)',
    'markets.alpaca.client.openapi.broker.api.EventsApi#suscribeToAccountStatusSSECall' +
        '(java.time.LocalDate,java.time.LocalDate,java.lang.Integer,java.lang.Integer,' +
        'java.lang.String,java.lang.String,java.lang.String,' +
        'markets.alpaca.client.openapi.broker.http.ApiCallback)',
    'markets.alpaca.client.openapi.broker.api.EventsApi#suscribeToAccountStatusSSEWithHttpInfo' +
        '(java.time.LocalDate,java.time.LocalDate,java.lang.Integer,java.lang.Integer,' +
        'java.lang.String,java.lang.String,java.lang.String)',
    'markets.alpaca.client.openapi.broker.api.IraApi#listIRAExcessContritbutions()',
    'markets.alpaca.client.openapi.broker.api.IraApi#listIRAExcessContritbutionsAsync' +
        '(markets.alpaca.client.openapi.broker.http.ApiCallback)',
    'markets.alpaca.client.openapi.broker.api.IraApi#listIRAExcessContritbutionsCall' +
        '(markets.alpaca.client.openapi.broker.http.ApiCallback)',
    'markets.alpaca.client.openapi.broker.api.IraApi#listIRAExcessContritbutionsWithHttpInfo()',
    'markets.alpaca.client.openapi.broker.model.Asset#SERIALIZED_NAME_EASY_TO_BORROW',
    'markets.alpaca.client.openapi.broker.model.Asset#easyToBorrow(java.lang.Boolean)',
    'markets.alpaca.client.openapi.broker.model.Asset#getEasyToBorrow()',
    'markets.alpaca.client.openapi.broker.model.Asset#setEasyToBorrow(java.lang.Boolean)',
    'markets.alpaca.client.openapi.trading.api.PositionsApi#deleteAllOpenPositions' +
        '(java.lang.Boolean)',
    'markets.alpaca.client.openapi.trading.model.Assets#SERIALIZED_NAME_EASY_TO_BORROW',
    'markets.alpaca.client.openapi.trading.model.Assets#easyToBorrow(java.lang.Boolean)',
    'markets.alpaca.client.openapi.trading.model.Assets#getEasyToBorrow()',
    'markets.alpaca.client.openapi.trading.model.Assets#setEasyToBorrow(java.lang.Boolean)',
    'markets.alpaca.client.openapi.trading.model.PositionClosedReponse',
    'markets.alpaca.client.openapi.trading.model.PositionClosedReponse$CustomTypeAdapterFactory',
    'markets.alpaca.client.openapi.trading.model.PositionClosedReponse$CustomTypeAdapterFactory$1',
]
def apiCompatibilityTool = configurations.create('apiCompatibilityTool') {
    canBeConsumed = false
    canBeResolved = true
    visible = false
}

dependencies.add(apiCompatibilityTool.name, libs.japicmp)

def apiCompatibilityBaselineFile = layout.buildDirectory.file(
    apiBaselineVersion.map {
        "api-compatibility/alpaca-java-${it}.jar"
    })
def downloadApiCompatibilityBaseline = tasks.register('downloadApiCompatibilityBaseline') {
    group = 'verification'
    description = "Downloads the published alpaca-java ${apiBaselineVersion.get()} baseline"
    inputs.property('apiBaselineVersion', apiBaselineVersion)
    outputs.file(apiCompatibilityBaselineFile)

    doLast {
        String version = apiBaselineVersion.get()
        if (!(version ==~ /[0-9A-Za-z][0-9A-Za-z.-]*/)) {
            throw new GradleException("Invalid apiBaselineVersion: ${version}")
        }
        File destination = apiCompatibilityBaselineFile.get().asFile
        destination.parentFile.mkdirs()
        File temporary = new File(temporaryDir, destination.name)
        URL source = new URI(
            "https://repo.maven.apache.org/maven2/markets/alpaca/alpaca-java/" +
                "${version}/alpaca-java-${version}.jar").toURL()
        def connection = source.openConnection()
        connection.connectTimeout = 15_000
        connection.readTimeout = 30_000
        connection.inputStream.withCloseable { input ->
            Files.copy(input, temporary.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
        new JarFile(temporary).withCloseable { ignored -> }
        Files.move(
            temporary.toPath(),
            destination.toPath(),
            StandardCopyOption.REPLACE_EXISTING)
    }
}

spotless {
    java {
        target 'src/**/*.java', 'examples/src/**/*.java'
        targetExclude 'src/main/java/markets/alpaca/client/openapi/**/*.java'
        importOrder()
        removeUnusedImports()
        googleJavaFormat()
        formatAnnotations()
    }

    format 'misc', {
        target '*.gradle', '*.md', '*.properties', '*.toml', '*.yml', '*.yaml',
            '.gitignore',
            'examples/*.gradle', 'examples/*.md',
            'gradle/*.properties', 'gradle/*.toml',
            'build-logic/*.gradle', 'build-logic/src/main/groovy/**/*.groovy'
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configDirectory = layout.projectDirectory.dir('config/checkstyle')
}

pluginManager.withPlugin('java') {
    tasks.register('checkApiCompatibility', JavaExec) {
        group = 'verification'
        description =
            "Checks the complete public JAR against alpaca-java ${apiBaselineVersion.get()}"
        dependsOn tasks.named('jar'), downloadApiCompatibilityBaseline
        classpath = apiCompatibilityTool
        mainClass = 'japicmp.JApiCmp'

        doFirst {
            setArgs([
                '--old', apiCompatibilityBaselineFile.get().asFile.absolutePath,
                '--new', tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
                '--only-modified',
                '--ignore-missing-classes',
                '--exclude',
                (['markets.alpaca.client.sse.internal.*'] +
                    reviewedApiCompatibilityExclusions).join(';'),
                '--no-error-on-exclusion-incompatibility',
                '--error-on-binary-incompatibility',
                '--error-on-source-incompatibility',
            ])
        }
    }

    tasks.named('checkstyleMain').configure {
        source = fileTree('src/main/java') {
            include '**/*.java'
            exclude 'markets/alpaca/client/openapi/**'
        }
    }

    tasks.named('checkstyleTest').configure {
        source = fileTree('src/test/java') {
            include '**/*.java'
        }
    }

    spotbugs {
        effort = Effort.valueOf('MAX')
        reportLevel = Confidence.valueOf('MEDIUM')
    }

    tasks.named('spotbugsMain').configure {
        dependsOn 'compileJava'
        sourceDirs = files('src/main/java')
        // Exclude rather than allowlist so new handwritten packages are analysed by default.
        classes = fileTree(
            dir: layout.buildDirectory.dir('classes/java/main'),
            exclude: ['markets/alpaca/client/openapi/**'])
        auxClassPaths = files(
            sourceSets.main.compileClasspath,
            layout.buildDirectory.dir('classes/java/main'))
        excludeFilter = file('config/spotbugs/exclude.xml')
        reports {
            xml.required = false
            html.required = true
        }
    }

    tasks.named('spotbugsTest').configure {
        enabled = false
    }
}
